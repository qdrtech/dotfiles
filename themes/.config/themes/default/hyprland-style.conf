# Default Theme - Hyprland Style Configuration
# This file contains ONLY styling (colors, opacity, blur, borders, gaps)
# Behavior and structure are in base configs

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 12
        passes = 10
        new_optimizations = on
        ignore_opacity = true
        xray = true
        blurls = waybar
    }

    shadow {
        enabled = true
        range = 50
        render_power = 3
        color = 0x66000000
    }
}

general {
    # Gaps and borders
    gaps_in = 10
    gaps_out = 14
    border_size = 3

    # Border colors (transparent for current setup)
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(ffffffff)
}
