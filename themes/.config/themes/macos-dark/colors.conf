# ==============================================================================
# HELPER FUNCTIONS
# ==============================================================================

# Convert hex to RGB
hex_to_rgb() {
    local hex=$1
    hex=${hex#"#"}
    printf "%d,%d,%d" 0x${hex:0:2} 0x${hex:2:2} 0x${hex:4:2}
}

# Convert hex to rgba with opacity
hex_to_rgba() {
    local hex=$1
    local opacity=$2
    hex=${hex#"#"}
    printf "rgba(%d,%d,%d,%s)" 0x${hex:0:2} 0x${hex:2:2} 0x${hex:4:2} "$opacity"
}

# Get theme variable by name
get_theme_var() {
    local var_name="THEME_$1"
    echo "${!var_name}"
}

