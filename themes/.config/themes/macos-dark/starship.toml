# macOS Dark Theme - Starship Configuration
# Version: 1.0
# This file will be expanded in Phase 4

# ==============================================================================
# PALETTE
# ==============================================================================

palette = "macos"

[palettes.macos]
blue = "#0A84FF"
green = "#32D74B"
yellow = "#FFD60A"
red = "#FF453A"
purple = "#BF5AF2"
cyan = "#64D2FF"
orange = "#FF9F0A"
white = "#FFFFFF"
gray = "#A0A0A0"

# ==============================================================================
# CHARACTER (PROMPT)
# ==============================================================================

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"

# ==============================================================================
# DIRECTORY
# ==============================================================================

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

# ==============================================================================
# GIT
# ==============================================================================

[git_branch]
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"

# ==============================================================================
# OTHER MODULES
# ==============================================================================

[nodejs]
style = "bold green"

[python]
style = "bold yellow"

[rust]
style = "bold orange"
