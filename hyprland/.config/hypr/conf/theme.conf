# Default Theme - Hyprland Style Configuration
# This file contains ONLY styling (colors, opacity, blur, borders, gaps)
# Behavior and structure are in base configs

# Palette comes from ~/.config/hypr/theme-colors.conf (generated by theme-switch.sh)
# Available: $bg $surface $surface_alt $fg $fg_muted $accent $accent_alt $warn $error $success

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

general {
    # Gaps and borders
    gaps_in = 10
    gaps_out = 14
    border_size = 1

    # Border colors use palette
    col.active_border = $fg_muted
    col.inactive_border = $surface
}
