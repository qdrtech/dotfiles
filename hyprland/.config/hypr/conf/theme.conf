# macOS Dark Theme - Hyprland Configuration
# Source this file from your main hyprland.conf
# Version: 1.0

# ==============================================================================
# COLORS
# ==============================================================================

# Active border (focused window)
$active_border = rgb(0A84FF)

# Inactive border
$inactive_border = rgb(3C3C3C)

# Shadow color
$shadow_color = rgba(000000aa)

# ==============================================================================
# DECORATION
# ==============================================================================

decoration {
    # Border radius (macOS window corners)
    rounding = 12

    # Border
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    # Shadows (modern syntax with nested block)
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = 0xaa000000
        offset = 0 4
    }

    # Blur
    blur {
        enabled = true
        size = 12
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.95
        brightness = 0.98
        vibrancy = 0.2
        vibrancy_darkness = 0.5
    }

    # Dim
    dim_inactive = false
    dim_strength = 0.05
}

# ==============================================================================
# BORDERS
# ==============================================================================

general {
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border

    # Gaps
    gaps_in = 8
    gaps_out = 16

    # Layout
    layout = dwindle

    # Border behavior
    resize_on_border = true
    hover_icon_on_border = true
}

# ==============================================================================
# CURSOR
# ==============================================================================

cursor {
    no_warps = false
}

# ==============================================================================
# ANIMATIONS
# ==============================================================================

animations {
    enabled = true

    # macOS-style smooth easing
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeOutQuart, 0.25, 1, 0.5, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1

    # Window animations
    animation = windowsIn, 1, 3, easeOutExpo, slide
    animation = windowsOut, 1, 3, easeOutExpo, slide
    animation = windowsMove, 1, 3, easeOutQuart, slide

    # Fade animations
    animation = fadeIn, 1, 3, easeOutExpo
    animation = fadeOut, 1, 3, easeOutExpo
    animation = fadeSwitch, 1, 3, easeOutExpo
    animation = fadeDim, 1, 3, easeOutExpo

    # Workspace animations
    animation = workspaces, 1, 4, easeOutQuart, slide

    # Border color animation
    animation = border, 1, 5, easeInOutCubic
    animation = borderangle, 1, 8, easeInOutCubic
}

# ==============================================================================
# WINDOW RULES
# ==============================================================================

# Example window rules for opacity
windowrulev2 = opacity 0.95 0.95, class:^(kitty)$
windowrulev2 = opacity 0.95 0.95, class:^(ghostty)$
windowrulev2 = opacity 1.0 1.0, class:^(firefox)$
windowrulev2 = opacity 1.0 1.0, class:^(chrome)$

# Floating windows get slight transparency
windowrulev2 = opacity 0.98 0.98, floating:1
