# Setup XDG for screen sharing and start waypaper and waybar
exec-once = ~/.config/hypr/scripts/xdg.sh

# Launch Waybar
exec-once = sh ~/.config/waybar/launch.sh

# Using hypridle for hyprlock
exec-once = hypridle 

# Load other startup items
exec-once = nm-applet --indicator & hyprpaper & blueman-applet
