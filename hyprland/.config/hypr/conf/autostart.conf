# Import GSettings
exec = sh ~/.config/scripts/import-gsettings.sh

# Launch Waybar
exec-once = sh ~/.config/waybar/scripts/launch.sh

# Using hypridle for hyprlock
exec-once = hypridle 

# enable night shade
exec = hyprshade auto

# Load other startup items
exec-once = nm-applet --indicator & hyprpaper & blueman-applet
